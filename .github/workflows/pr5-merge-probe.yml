name: PR 5 controlled integration

on:
  push:
    branches: [feat/soil-organization]
    paths: ['.github/workflows/pr5-merge-probe.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Resolve PR 5 against tested main and push merge commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Soil integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main >/tmp/soil-merge.log 2>&1 || true
          cat /tmp/soil-merge.log
          test -f .git/MERGE_HEAD
          # PR5 supplies a coherent newer snapshot engine implementation. Avoid mixing incompatible API internals from main.
          git checkout HEAD -- engine/build.ps1 engine/src/devices.c engine/src/ipc.c engine/src/ne2000.c engine/src/pci.c engine/src/snapshot.c engine/src/virtio_blk.c engine/src/vmdefs.h engine/src/vmhost.c engine/src/winhv.c
          git checkout HEAD -- .gitattributes app/Soil/MainForm.cs app/Soil/VmManager.cs
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET
          
          def prefer_pr5(path):
              source = Path(path)
              lines = source.read_text(encoding='utf-8-sig').splitlines(keepends=True)
              output = []
              mode = 'normal'
              nconflicts = 0
              for line in lines:
                  if line.startswith('<<<<<<< '):
                      assert mode == 'normal', (path,mode)
                      mode = 'pr5'
                      nconflicts += 1
                  elif line.startswith('=======') and mode == 'pr5':
                      mode = 'main'
                  elif line.startswith('>>>>>>> ') and mode == 'main':
                      mode = 'normal'
                  elif mode in ('normal','pr5'):
                      output.append(line)
              assert mode == 'normal', path
              source.write_text(''.join(output), encoding='utf-8')
              print(f'Resolved {path}: {nconflicts} conflicts; preserved PR5 regions')
          
          for path in [
              'README.md',
              'app/Soil/AppServer.cs',
              'app/Soil/Soil.csproj',
              'app/Soil/ui/style.css',
              'app/build.ps1',
              'app/installer/Soil.wxs',
              'app/installer/build-msi.ps1',
          ]:
              prefer_pr5(path)
          
          readme = Path('README.md')
          readme.write_text(readme.read_text().replace('Soil-0.3.11-x64.msi', 'Soil-4.2.1-x64.msi'), encoding='utf-8')
          
          project = Path('app/Soil/Soil.csproj')
          text = project.read_text()
          assert '<Version>4.2.1</Version>' in text
          if '<Content Include="skill\\**\\*">' not in text:
              skill = ('    <Content Include="skill\\**\\*">\n'
                       '      <CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory>\n'
                       '      <CopyToPublishDirectory>PreserveNewest</CopyToPublishDirectory>\n'
                       '    </Content>\n')
              assert '    <EmbeddedResource Include=' in text
              text = text.replace('    <EmbeddedResource Include=', skill + '    <EmbeddedResource Include=', 1)
              project.write_text(text, encoding='utf-8')
          ET.parse(project)
          
          csspath = Path('app/Soil/ui/style.css')
          css = csspath.read_text()
          main_css = subprocess.check_output(['git','show','origin/main:app/Soil/ui/style.css'],text=True)
          assert '.skill-button{' in main_css and '.install-result.error{' in main_css
          if '.skill-button{' not in css:
              append = main_css[main_css.index('.skill-button{'):]
              csspath.write_text(css.rstrip() + '\n' + append,encoding='utf-8')
          
          appserver = Path('app/Soil/AppServer.cs')
          server = appserver.read_text()
          assert 'm_github.Dispose();' in server
          assert 'm_paths.CliEndpointPath' in server
          assert 'MapGet("/api/skill"' in server and 'MapPost("/api/skill/install"' in server
          if 'File.Delete(m_paths.CliEndpointPath)' not in server:
              cleanup = '''        try
                  {
                      if (File.Exists(m_paths.CliEndpointPath))
                      {
                          using var endpoint = JsonDocument.Parse(File.ReadAllText(m_paths.CliEndpointPath));
                          if (string.Equals(endpoint.RootElement.GetProperty("url").GetString(), Url,
                                  StringComparison.OrdinalIgnoreCase))
                              File.Delete(m_paths.CliEndpointPath);
                      }
                  }
                  catch
                  {
                  }
          '''
              server = server.replace('        m_app.DisposeAsync().AsTask().GetAwaiter().GetResult();',cleanup + '        m_app.DisposeAsync().AsTask().GetAwaiter().GetResult();',1)
              appserver.write_text(server, encoding='utf-8')
          
          buildwf = Path('.github/workflows/build-msi.yml')
          wf=buildwf.read_text()
          assert 'Soil-4.2.0-x64' in wf
          buildwf.write_text(wf.replace('Soil-4.2.0-x64','Soil-4.2.1-x64'),encoding='utf-8')
          
          program = Path('app/Soil/Program.cs').read_text()
          assert 'SoilCli.Run' in program
          assert Path('app/Soil/SoilCli.cs').is_file()
          assert Path('app/Soil/SkillInstaller.cs').is_file()
          assert Path('app/macos/Sources/SoilMac/SoilMacApp.swift').is_file()
          assert Path('engine/src/snapshot.c').is_file()
          assert 'CliEndpointPath' in Path('app/Soil/SoilPaths.cs').read_text()
          assert '<Content Include="skill\\**\\*">' in project.read_text()
          print('Integration assertions passed: PR3 CLI/skill + PR4 macOS + PR5 runtime/snapshot')
          
          PY
          git add -A
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --cached --check
          node --check app/Soil/ui/app.js
          node --check app/Soil/ui/app-ui.js
          node --check app/Soil/ui/onboarding.js
          node --check app/auth-worker/src/index.js
          node --check tools/soil-ci/soil-ci.mjs
          git diff --cached --stat
          git commit -m "Integrate tested CLI and macOS PRs into Soil 4.2.1 runtime"
          python3 - <<'PYMERGED'
          from pathlib import Path
          import base64
          files = [
              '.github/workflows/build-msi.yml',
              'README.md',
              'app/Soil/AppServer.cs',
              'app/Soil/Program.cs',
              'app/Soil/Soil.csproj',
              'app/Soil/SoilPaths.cs',
              'app/Soil/ui/app.js',
              'app/Soil/ui/index.html',
              'app/Soil/ui/style.css'
          ]
          for name in files:
              print('SOIL_MERGED_BLOB:' + name + ':' + base64.b64encode(Path(name).read_bytes()).decode('ascii'))
          PYMERGED
          echo "Merge tree built and checked; GitHub connector will publish commit"
          
