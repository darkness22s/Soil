name: macOS app smoke test
# Verify Apple Silicon guest boot and snapshots with real Git LFS images.

on:
  pull_request:
    paths:
      - "app/macos/**"
      - "app/images/**"
      - ".github/workflows/macos-smoke.yml"
  workflow_dispatch:

jobs:
  apple-silicon-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install QEMU
        run: brew install qemu

      - name: Install guest images
        run: |
          images="$HOME/Library/Application Support/Soil/images"
          mkdir -p "$images"
          cp app/images/{vmlinuz64,core2.gz,soil.squashfs} "$images/"
          if head -c 100 "$images/vmlinuz64" | grep -q 'version https://git-lfs.github.com/spec'; then
            echo 'ERROR: Git LFS guest images were not downloaded.' >&2
            exit 1
          fi

      - name: Build macOS app
        run: sh ./app/macos/build.sh

      - name: Run guest, idle, and snapshot smoke test
        run: app/macos/dist/Soil.app/Contents/MacOS/SoilMac --smoke-test
