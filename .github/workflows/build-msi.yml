name: Build Soil MSI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'soil-sdk/runtime/**'
      - 'tools/soil-ci/**'
      - '.github/workflows/build-msi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'soil-sdk/runtime/**'
      - 'tools/soil-ci/**'
      - '.github/workflows/build-msi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install static Linux toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build Linux guest SDK CLI
        run: bash tools/soil-ci/build-guest-cli.sh tools/soil-ci/out/soil
      - name: Download verified upstream Cua Driver for every guest
        run: bash tools/soil-ci/fetch-cua-driver.sh tools/soil-ci/out/cua-driver
      - uses: actions/upload-artifact@v4
        with:
          name: soil-linux-guest-cli
          path: |
            tools/soil-ci/out/soil
            tools/soil-ci/out/cua-driver
          if-no-files-found: error

  build:
    needs: guest-runtime
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and guest images
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          name: soil-linux-guest-cli
          path: tools/soil-ci/out

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up WinLibs MinGW-w64
        uses: bwoodsend/setup-winlibs-action@v1

      - name: Build VM engine
        shell: pwsh
        run: .\engine\build.ps1 -Gcc (Get-Command gcc).Source

      - name: Install WiX Toolset
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: pwsh
        run: .\app\build.ps1 -SkipEngine -GuestSoilExecutable .\tools\soil-ci\out\soil -GuestCuaDriver .\tools\soil-ci\out\cua-driver

      - name: Upload MSI artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Soil-4.2.1-x64
          path: app/dist/Soil-4.2.1-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact upload failure
        if: steps.upload.outcome == 'failure'
        shell: pwsh
        run: Write-Host '::warning::MSI built successfully, but artifact upload failed (check GitHub Actions storage quota). Free quota and rerun to publish the installer.'
