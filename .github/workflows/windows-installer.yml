name: Build Soil Windows installer

on:
  push:
    paths:
      - app/**
      - engine/**
      - soil-sdk/**
      - .github/workflows/windows-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install MinGW-w64
        shell: pwsh
        run: |
          choco install winlibs --yes --no-progress
          "C:\ProgramData\chocolatey\lib\winlibs\tools\mingw64\bin" >> $env:GITHUB_PATH
      - name: Install WiX Toolset
        shell: pwsh
        run: dotnet tool install --global wix --version 5.*
      - name: Build Windows x64 MSI
        shell: pwsh
        run: |
          $mingwRoot = "C:\ProgramData\chocolatey\lib\winlibs\tools"
          $gcc = Get-ChildItem -Path $mingwRoot -Filter gcc.exe -File -Recurse | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe not found under $mingwRoot" }
          $env:PATH = "$($gcc.DirectoryName);$env:PATH"
          .\app\build.ps1 -ImagesDir .\app\images -Gcc $gcc.FullName
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Soil-Windows-x64-installer
          path: app/dist/Soil-*-x64.msi
          if-no-files-found: error
          retention-days: 14
