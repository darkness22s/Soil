name: Boot real bundled Soil guest and execute native ELF

on:
  pull_request:
    paths:
      - 'app/images/**'
      - 'soil-sdk/runtime/**'
      - 'soil-sdk/tools/**'
      - 'tools/soil-ci/build-guest-cli.sh'
      - 'tools/soil-ci/guest-native-smoke.sh'
      - 'tools/soil-ci/GuestInitrdSmoke/**'
      - 'tools/soil-ci/inject-native-guest.py'
      - 'app/Soil/GuestInitrd.cs'
      - '.github/workflows/native-guest-vm-boot.yml'

permissions:
  contents: read

jobs:
  guest-native-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QEMU x86 emulator
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 gcc musl-tools busybox-static
      - name: Boot actual bundled Linux guest and run native ELF plus .sol package lifecycle
        run: bash tools/soil-ci/guest-native-smoke.sh app/images
