<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__NAME__</title>
</head>
<body>
  <main class="app">
    <p class="eyebrow">SOIL APP</p>
    <h1>__NAME__</h1>
    <p class="lede">Vite is serving this app with the Soil bridge injected.</p>

    <section class="card">
      <label for="note">Session note</label>
      <textarea id="note" rows="4" placeholder="Type something…"></textarea>
      <div class="actions">
        <button id="save" type="button">Save note</button>
        <button id="notify" type="button" class="secondary">Notify</button>
        <button id="info" type="button" class="secondary">App info</button>
      </div>
      <pre id="output" aria-live="polite"></pre>
    </section>

    <footer>
      <span id="status">starting…</span>
      <span>Built with Vite + the Soil SDK</span>
    </footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
