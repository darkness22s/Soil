<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect GitHub to start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231b1f23'/%3E%3Cpath fill='%23fff' d='M16 6c-3.1 0-5.6 2.5-5.6 5.6 0 4.4 3 8 6.9 9.4.5.1.9.2 1.4.3.2 0 .3-.1.3-.3v-2.2c0-.9 1.3-1.5 1.9-.4.5 1 .4 2.2-.6 3-.9.7-2 1.1-2.3 1.2-.5.1-1 .2-1.5.2.6.1 3.4-.6 5.3-2.7A10.05 10.05 0 0 1 16 6Z'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:light;
    --paper:#fffefc;
    --ink:#191917;
    --mark:#1b1f23;
    --panel:#ffffff;
    --btn-idle:#d2d2d0;
    --btn-active:#1c1b18;
    --c1:#4b7cff;
    --c2:#49a2ff;
    --c3:#e85b83;
    --c4:#f2c34c;
    --line:#e4e4e1;
    --btn-ease:.18s ease;
    --spring:cubic-bezier(.3,1.5,.45,1);
    font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-synthesis:none;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  @property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
  @property --ang2{syntax:"<angle>";inherits:false;initial-value:210deg}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);overflow:hidden}
  ::selection{color:var(--paper);background:var(--ink)}

  .defs{position:absolute;width:0;height:0;overflow:hidden}

  .dots{position:fixed;inset:0;z-index:0;pointer-events:none}

  .stage{
    position:relative;
    z-index:1;
    min-height:100svh;
  }

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

  .page{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 24px 64px;
  }
  .page[hidden]{display:none}

  .title{
    z-index:3;
    margin:0;
    font-size:clamp(25px,3vw,33px);
    font-weight:500;
    line-height:1.22;
    letter-spacing:-.012em;
    text-align:center;
    color:var(--ink);
  }
  .title .w{display:inline-block;padding-bottom:.1em;margin-bottom:-.1em}
  .title .w + .w{margin-left:.28em}
  .title .ch{
    display:inline-block;
    will-change:transform,filter;
    opacity:0;
    filter:blur(10px);
    transform:translateY(14px);
    animation:chRise .6s cubic-bezier(.22,1,.36,1) forwards;
    animation-delay:calc(.05s + var(--k) * .028s);
  }
  @keyframes chRise{
    0%{opacity:0;filter:blur(10px);transform:translateY(14px)}
    100%{opacity:1;filter:blur(0);transform:translateY(0)}
  }

  .mark-slot{
    position:relative;
    z-index:2;
    display:grid;
    place-items:center;
    margin-top:clamp(52px,15vh,119px);
    width:min(13.2vh,106px);
    min-width:88px;
    aspect-ratio:1;
  }

  .aurora{
    position:fixed;
    left:50%;
    top:50%;
    width:430px;
    height:430px;
    margin:-215px 0 0 -215px;
    border-radius:50%;
    background:conic-gradient(from 90deg,rgba(75,124,255,.30),rgba(73,162,255,.24),rgba(232,91,131,.24),rgba(242,195,76,.28),rgba(75,124,255,.30));
    filter:blur(56px) saturate(.85);
    opacity:.12;
    -webkit-mask:radial-gradient(circle at 50% 50%,#000 34%,transparent 72%);
    mask:radial-gradient(circle at 50% 50%,#000 34%,transparent 72%);
    animation:spin 30s linear infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes spin{to{transform:rotate(1turn)}}

  .ground{
    position:absolute;
    bottom:-27px;
    left:50%;
    width:100px;
    height:19px;
    margin-left:-50px;
    border-radius:50%;
    background:radial-gradient(closest-side,rgba(23,21,21,.17),rgba(23,21,21,0) 72%);
    filter:blur(3px);
    opacity:0;
    animation:groundIn .6s ease 1.05s forwards;
  }
  @keyframes groundIn{to{opacity:1}}

  .mark{
    position:relative;
    z-index:1;
    display:block;
    width:100%;
    aspect-ratio:1;
    border-radius:50%;
    -webkit-user-drag:none;
    opacity:0;
    transform:translateY(6px);
    animation:markIn .55s cubic-bezier(.22,1,.36,1) .45s forwards;
  }
  @keyframes markIn{
    to{opacity:1;transform:translateY(0)}
  }
  .mark svg{display:block;width:100%;height:100%}
  .mark:focus-visible{outline:2px solid var(--ink);outline-offset:8px}

  .beam-host::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    padding:2.25px;
    background:
      conic-gradient(
        from var(--ang),
        rgba(255,255,255,0) 0deg,
        rgba(255,255,255,0) 286deg,
        rgba(75,124,255,0) 291deg,
        rgba(75,124,255,.55) 297deg,
        var(--c1) 303deg,
        var(--c2) 312deg,
        var(--c3) 322deg,
        var(--c4) 333deg,
        rgba(242,195,76,.75) 341deg,
        rgba(242,195,76,0) 350deg,
        rgba(255,255,255,0) 360deg
      ),
      conic-gradient(
        from var(--ang2),
        rgba(255,255,255,0) 0deg,
        rgba(255,255,255,0) 108deg,
        rgba(255,255,255,.9) 118deg,
        rgba(255,255,255,.9) 128deg,
        rgba(255,255,255,0) 139deg
      );
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    animation:sweep 3.8s linear infinite;
    pointer-events:none;
  }
  .beam-host::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:inherit;
    padding:4.5px;
    background:conic-gradient(
      from var(--ang),
      rgba(255,255,255,0) 0deg,
      rgba(255,255,255,0) 286deg,
      rgba(75,124,255,0) 291deg,
      rgba(75,124,255,.55) 297deg,
      var(--c1) 303deg,
      var(--c2) 312deg,
      var(--c3) 322deg,
      var(--c4) 333deg,
      rgba(242,195,76,.7) 341deg,
      rgba(242,195,76,0) 350deg,
      rgba(255,255,255,0) 360deg
    );
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    filter:blur(4.5px);
    opacity:.7;
    transition:opacity .25s ease;
    animation:sweep 3.8s linear infinite;
    pointer-events:none;
  }
  .connect-btn::before{animation:sweep 3.8s linear infinite,beamIn .7s ease-out 1.1s backwards}
  .connect-btn::after{animation:sweep 3.8s linear infinite,beamIn .7s ease-out 1.1s backwards}
  @keyframes sweep{
    from{--ang:0deg;--ang2:210deg}
    to{--ang:360deg;--ang2:-150deg}
  }
  @keyframes beamIn{
    from{opacity:0}
  }

  .halo{
    position:absolute;
    inset:-5px;
    border-radius:inherit;
    padding:10px;
    background:conic-gradient(
      from var(--ang),
      rgba(255,255,255,0) 0deg,
      rgba(255,255,255,0) 280deg,
      rgba(75,124,255,0) 288deg,
      rgba(75,124,255,.5) 298deg,
      var(--c1) 305deg,
      var(--c3) 322deg,
      var(--c4) 333deg,
      rgba(242,195,76,.6) 342deg,
      rgba(242,195,76,0) 352deg,
      rgba(255,255,255,0) 360deg
    );
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    filter:blur(12px);
    opacity:.16;
    transition:opacity .25s ease;
    animation:sweep 3.8s linear infinite,beamIn .7s ease-out 1.1s backwards;
    pointer-events:none;
  }
  .connect-btn:hover .halo{opacity:.4}
  .connect-btn.is-loading .halo{opacity:.35;animation:sweep 3.8s linear infinite,haloPulse 1.15s ease-in-out infinite}
  @keyframes haloPulse{
    0%,100%{opacity:.35}
    50%{opacity:.65}
  }

  .connect-btn{
    position:relative;
    z-index:3;
    min-width:173px;
    height:54px;
    padding:0 44px;
    border:0;
    border-radius:13px;
    cursor:pointer;
    background:var(--btn-idle);
    color:#fff;
    font:700 19px/1 Georgia,"Iowan Old Style","Times New Roman",serif;
    letter-spacing:.01em;
    text-shadow:0 1px 1px rgba(23,21,21,.16);
    box-shadow:0 16px 32px -20px rgba(23,21,21,.4);
    transition:background var(--btn-ease),box-shadow var(--btn-ease),color var(--btn-ease);
    -webkit-tap-highlight-color:transparent;
  }
  .connect-btn.is-loading,
  .connect-btn.is-done,
  .connect-btn:hover{
    background:var(--btn-active);
    text-shadow:none;
    box-shadow:0 20px 44px -20px rgba(23,21,21,.6);
  }
  .connect-btn:active{transform:translateY(1px)}
  .connect-btn:focus-visible{outline:2px solid var(--btn-active);outline-offset:5px}

  .bloomi{
    position:absolute;
    left:var(--bx,50%);
    top:var(--by,50%);
    width:24px;
    height:24px;
    margin:-12px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 70%);
    opacity:0;
    pointer-events:none;
  }
  .bloomi.go{animation:bloomR .55s ease-out forwards}
  @keyframes bloomR{
    0%{opacity:1;transform:scale(.4)}
    100%{opacity:0;transform:scale(3.2)}
  }

  .face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    opacity:0;
    visibility:hidden;
    transition:opacity .22s ease,visibility 0s linear .25s;
  }
  .face.label{opacity:1;visibility:visible;transition:opacity .22s ease,visibility 0s}
  .connect-btn.is-loading .face.label,
  .connect-btn.is-done .face.label{opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s linear .22s}
  .connect-btn.is-loading .face.loader{opacity:1;visibility:visible;transition:opacity .25s ease .1s,visibility 0s}
  .connect-btn.is-done .face.loader{opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s linear .2s}
  .connect-btn.is-done .face.done{opacity:1;visibility:visible;animation:doneIn .5s var(--spring);transition:visibility 0s,opacity .22s ease}
  @keyframes doneIn{
    0%{opacity:0;transform:translateY(7px) scale(.94)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }

  .face.loader{filter:url(#goo)}
  .lb{
    position:absolute;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    margin:-8px;
    border-radius:50%;
    background:#fff;
    animation:lbBob 1.1s ease-in-out infinite;
  }
  @keyframes lbBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(.94)}}
  .ld{
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    margin:-5px;
    border-radius:50%;
    background:#fff;
    animation:run 1.1s ease-in-out infinite;
  }
  .ld.l1{animation-delay:0s}
  .ld.l2{animation-delay:.18s}
  @keyframes run{
    0%{transform:translate(-24px,-4px) scale(1)}
    50%{transform:translate(0,4px) scale(.66)}
    100%{transform:translate(24px,-4px) scale(1)}
  }

  .done{font-size:17px;font-weight:700}
  .done svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:#fff;
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .done svg path{
    stroke-dasharray:24;
    stroke-dashoffset:24;
    animation:draw .45s ease-out .12s forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0}}

  .theme-tgl{
    position:fixed;
    top:20px;
    right:20px;
    z-index:20;
    width:44px;
    height:44px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:background .25s ease,color .25s ease,border-color .25s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .theme-tgl:hover{border-color:var(--ink)}
  .theme-tgl:active{transform:translateY(1px)}
  .theme-tgl:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .theme-tgl svg{
    position:absolute;
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:opacity .3s ease,transform .45s cubic-bezier(.3,1.4,.4,1);
  }
  .i-sun{opacity:0;transform:rotate(-90deg) scale(.6)}
  html.dark .i-sun{opacity:1;transform:rotate(0deg) scale(1)}
  html.dark .i-moon{opacity:0;transform:rotate(90deg) scale(.6)}

  ::view-transition-old(root),
  ::view-transition-new(root){
    animation:none;
    mix-blend-mode:normal;
  }
  html.vt-in::view-transition-new(root){
    animation:vtIn .68s cubic-bezier(.4,0,.2,1) forwards;
  }
  html.vt-out::view-transition-old(root){
    z-index:2;
    animation:vtOut .6s cubic-bezier(.4,0,.2,1) forwards;
  }
  html.vt-page::view-transition-new(root){
    animation:vtIn .85s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes vtIn{
    from{clip-path:circle(0px at var(--vt-x,100%) var(--vt-y,20px))}
    to{clip-path:circle(var(--vt-r,140%) at var(--vt-x,100%) var(--vt-y,20px))}
  }
  @keyframes vtOut{
    from{clip-path:circle(var(--vt-r,140%) at var(--vt-x,100%) var(--vt-y,20px))}
    to{clip-path:circle(0px at var(--vt-x,100%) var(--vt-y,20px))}
  }

  .page-repo{padding-top:clamp(56px,10.6vh,84px)}
  .page-repo .title .ch{animation:none;opacity:1;filter:none;transform:none}
  .page-repo:not(.settled) .title,
  .page-repo:not(.settled) .rise{
    opacity:0;
  }
  .page-repo.settled .title{
    animation:blockRise .6s cubic-bezier(.22,1,.36,1) .04s forwards;
  }
  .page-repo.settled .rise.d-1{animation:blockRise .58s cubic-bezier(.22,1,.36,1) .18s forwards}
  .page-repo.settled .rise.d-2{animation:blockRise .58s cubic-bezier(.22,1,.36,1) .3s forwards}

  .page-repo .agm-col{margin-top:clamp(48px,9.5vh,74px)}
  .agm-col{width:min(464px,100%);display:flex;flex-direction:column}
  .agm-sub{font-size:13.5px;color:var(--muted);letter-spacing:-.005em;margin:0 0 16px;text-align:left}
  .agm-list{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
  .agm-list.shake{animation:shake .45s ease}
  .agm-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border:1px solid var(--line);
    border-radius:13px;
    background:var(--panel);
    font:400 16px/1 "DM Sans",system-ui,sans-serif;
    letter-spacing:-.005em;
    text-align:left;
    cursor:pointer;
    color:var(--ink);
    box-shadow:0 1px 2px rgba(23,21,21,.04);
    transition:border-color .18s ease,background .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .agm-item:hover{border-color:#bdbab4}
  .agm-item:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .agm-item .uc-check{width:20px;height:20px;margin-top:0}
  .agm-item[aria-checked="true"] .uc-check{background:var(--ink);border-color:var(--ink)}
  .agm-item[aria-checked="true"] .uc-check svg{opacity:1;transform:scale(1)}
  .ag-ic{flex-shrink:0;width:24px;height:24px;display:grid;place-items:center;color:var(--ink)}
  .ag-ic svg{width:18px;height:18px}
  .ag-ic img{width:18px;height:18px;object-fit:contain;display:block}
  .ag-nm{font-size:15px;font-weight:600;line-height:1}

  .mk1-card{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--panel);
    box-shadow:0 1px 2px rgba(23,21,21,.04);
    text-align:left;
    transition:border-color .18s ease;
  }
  .mk1-card:hover{border-color:#bdbab4}
  .mk1-chip{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:10px;
    background:color-mix(in srgb, var(--ink) 8%, transparent);
    display:grid;
    place-items:center;
  }
  .mk1-chip svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .mk1-body{min-width:0;flex:1}
  .mk1-nm{display:block;font-size:15px;font-weight:600;line-height:1.15}
  .mk1-meta{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
  .mk1-note{flex-shrink:0;padding-left:12px;border-left:1px solid var(--line);font-size:11px;font-weight:600;line-height:1.6;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  html.dark .mk1-card:hover{border-color:#484845}
  .agm-col .dd{margin-top:12px}
  .di-meta.rec{color:#c8942a;font-weight:700}
  html.dark .di-meta.rec{color:#f2c34c}
  @keyframes blockRise{
    0%{opacity:0;transform:translateY(16px);filter:blur(8px)}
    100%{opacity:1;transform:translateY(0);filter:blur(0)}
  }
  .rise{display:flex;justify-content:center}
  .page-repo .rise.d-1{position:relative;z-index:6}
  .page-repo .rise.d-2{position:relative;z-index:2}

  .page-repo .dd{
    position:relative;
    margin-top:clamp(48px,9.5vh,74px);
  }
  .page-repo .dd-trigger{
    position:relative;
    z-index:4;
    display:flex;
    align-items:center;
    gap:11px;
    min-width:360px;
    height:54px;
    padding:0 16px;
    border:1px solid var(--line);
    border-radius:14px;
    cursor:pointer;
    background:var(--panel);
    color:var(--muted,#a9a9a5);
    font:400 16px/1 "DM Sans",system-ui,sans-serif;
    letter-spacing:-.005em;
    box-shadow:0 1px 2px rgba(23,21,21,.04);
    transition:border-color var(--btn-ease),box-shadow var(--btn-ease),background var(--btn-ease),color var(--btn-ease);
    -webkit-tap-highlight-color:transparent;
  }
  .dd-trigger .ti{
    width:16px;
    height:16px;
    flex-shrink:0;
    fill:currentColor;
    color:var(--ink);
    opacity:.4;
    transition:opacity .2s ease,color .2s ease;
  }
  .dd-trigger .lbl{
    flex:1;
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dd-trigger:hover{border-color:#bdbab4}
  .dd-trigger.open{border-color:var(--ink);color:var(--ink);box-shadow:0 14px 30px -18px rgba(23,21,21,.4)}
  .dd-trigger.has{color:var(--ink);font-weight:500}
  .dd-trigger.has .ti{opacity:.75}
  .dd-trigger:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
  .dd-trigger .chev{
    width:16px;
    height:16px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    flex-shrink:0;
    color:var(--muted,#a9a9a5);
    transition:transform .35s cubic-bezier(.3,1.4,.4,1),color .2s ease;
  }
  .dd-trigger.open .chev{transform:rotate(180deg);color:var(--ink)}
  .dd-trigger::before{opacity:0;transition:opacity .25s ease}
  .dd-trigger::after{opacity:0;transition:opacity .25s ease}
  .dd-trigger.open::before,
  .dd-trigger.has::before{opacity:1}
  .dd-trigger.open::after{opacity:.9}
  .dd-trigger.has::after{opacity:.5}
  .dd-trigger.shake{animation:shake .45s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(3px)}
  }
  .dd-menu{
    position:absolute;
    top:calc(100% + 12px);
    left:50%;
    min-width:100%;
    transform:translateX(-50%) translateY(-10px) scale(.965);
    transform-origin:50% -10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:7px;
    box-shadow:0 30px 60px -28px rgba(23,21,21,.4),0 6px 16px -8px rgba(23,21,21,.14);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .18s ease,transform .2s cubic-bezier(.3,1.2,.4,1),visibility 0s linear .18s,filter .2s ease;
    filter:blur(5px);
    z-index:5;
    will-change:transform,opacity;
  }
  .dd.open .dd-menu{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0) scale(1);
    filter:blur(0);
    transition:opacity .3s ease,transform .5s cubic-bezier(.26,1.45,.42,1),visibility 0s,filter .32s ease;
  }
  .dd-item{
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    padding:10px 13px;
    border:0;
    border-radius:10px;
    background:none;
    cursor:pointer;
    text-align:left;
    font-family:"DM Sans",system-ui,sans-serif;
    color:var(--ink);
    opacity:0;
    transform:translateY(-7px);
    transition:opacity .14s ease,transform .14s ease,background .16s ease;
  }
  .dd.open .dd-item{
    opacity:1;
    transform:translateY(0);
    transition:opacity .36s ease calc(.05s * var(--j) + .08s),transform .4s cubic-bezier(.26,1.45,.42,1) calc(.05s * var(--j) + .08s),background .16s ease;
  }
  .dd-item:hover,
  .dd-item.kb-active{background:rgba(23,21,21,.055)}
  .dd-item[aria-selected="true"]{background:rgba(23,21,21,.04)}
  .dd-item:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .di-ic{
    width:15px;
    height:15px;
    flex-shrink:0;
    fill:currentColor;
    opacity:.35;
    transition:color .2s ease,opacity .2s ease;
  }
  .dd-item[aria-selected="true"] .di-ic{color:var(--c3);opacity:.9}
  .di-name{
    font-size:15px;
    font-weight:500;
    letter-spacing:-.005em;
    display:block;
    flex:0 1 auto;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dd-item[aria-selected="true"] .di-name{font-weight:600}
  .dd-item[aria-selected="true"] .di-name::before{
    content:"";
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--c3);
    margin-right:9px;
    vertical-align:2px;
  }
  .di-meta{
    margin-left:auto;
    padding-left:14px;
    font-size:12.5px;
    color:var(--muted,#a9a9a5);
    white-space:nowrap;
    flex-shrink:0;
  }
  html.dark .dd-item:hover,
  html.dark .dd-item.kb-active{background:rgba(245,245,243,.07)}
  html.dark .dd-item[aria-selected="true"]{background:rgba(245,245,243,.05)}

  .page-repo .b2{margin-top:clamp(64px,14vh,112px)}
  .page-repo .b2 .connect-btn{min-width:140px;padding:0 38px}

  .page-use{padding-top:clamp(56px,10.6vh,84px)}
  .use-sub{
    z-index:3;
    margin:15px 0 0;
    color:var(--muted,#a9a9a5);
    font-size:15.5px;
    letter-spacing:-.005em;
    text-align:center;
    opacity:0;
    animation:blockRise .6s cubic-bezier(.22,1,.36,1) .34s forwards;
  }
  .use-cards{
    position:relative;
    z-index:3;
    width:min(464px,100%);
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:clamp(40px,8vh,64px);
    opacity:0;
    animation:blockRise .6s cubic-bezier(.22,1,.36,1) .5s forwards;
  }
  .use-card{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:13px;
    padding:15px 16px 15px 14px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--panel);
    font:400 16px/1 "DM Sans",system-ui,sans-serif;
    letter-spacing:-.005em;
    text-align:left;
    cursor:pointer;
    color:var(--ink);
    box-shadow:0 1px 2px rgba(23,21,21,.04);
    opacity:0;
    transform:translateY(12px);
    animation:ucIn .55s cubic-bezier(.22,1,.36,1) forwards;
    animation-delay:calc(.72s + var(--j) * .08s);
    transition:border-color var(--btn-ease),box-shadow var(--btn-ease),background var(--btn-ease);
    -webkit-tap-highlight-color:transparent;
  }
  @keyframes ucIn{
    to{opacity:1;transform:translateY(0)}
  }
  .use-card:hover{border-color:#bdbab4}
  .use-card::before{
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:19px;
    border:1.6px solid var(--ink);
    opacity:0;
    transition:opacity .22s ease;
    pointer-events:none;
  }
  .use-card::after{
    content:"";
    position:absolute;
    inset:2px;
    border-radius:11px;
    border:1px solid var(--ink);
    opacity:0;
    transition:opacity .22s ease;
    pointer-events:none;
  }
  .use-card[aria-checked="true"]::before{opacity:1}
  .use-card[aria-checked="true"]::after{opacity:1}
  .use-card[aria-checked="true"]{
    border-color:transparent;
    box-shadow:0 18px 36px -24px rgba(23,21,21,.42);
  }
  .use-card:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
  .uc-check{
    flex-shrink:0;
    width:22px;
    height:22px;
    margin-top:1px;
    border-radius:50%;
    border:1.4px solid var(--line);
    display:grid;
    place-items:center;
    transition:background var(--btn-ease),border-color var(--btn-ease);
  }
  .uc-check svg{
    width:11px;
    height:11px;
    fill:none;
    stroke:#fff;
    stroke-width:2.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0;
    transform:scale(.6);
    transition:opacity .18s ease,transform .25s var(--spring);
  }
  .use-card[aria-checked="true"] .uc-check{background:var(--ink);border-color:var(--ink)}
  .use-card[aria-checked="true"] .uc-check svg{opacity:1;transform:scale(1)}
  .uc-body{min-width:0;flex:1}
  .uc-name{
    display:flex;
    align-items:center;
    gap:9px;
    line-height:22px;
    font-size:15.5px;
    font-weight:600;
  }
  .uc-tag{
    margin-left:auto;
    flex-shrink:0;
    font-style:normal;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.01em;
    padding:4px 10px;
    border-radius:999px;
    background:var(--ink);
    color:var(--paper);
    opacity:0;
    transform:translateY(-3px);
    transition:opacity .25s ease,transform .3s var(--spring);
    pointer-events:none;
  }
  .use-card[aria-checked="true"] .uc-tag{opacity:1;transform:none}
  .uc-desc{
    display:block;
    margin-top:6px;
    font-size:13.5px;
    line-height:1.55;
    letter-spacing:0;
    color:var(--muted,#a9a9a5);
  }
  .uc-chips{display:flex;flex-wrap:wrap;align-items:center;gap:9px 16px;margin-top:10px}
  .lg{
    display:inline-flex;
    align-items:center;
    gap:7px;
    opacity:.85;
    cursor:default;
    transition:opacity .16s ease;
  }
  .lg:hover{opacity:1}
  .lg svg{display:block;width:17px;height:17px}
  .lg img{display:block;height:17px;width:auto}
  .lg-n{
    font-size:13px;
    font-weight:600;
    letter-spacing:.002em;
    color:var(--ink);
    line-height:1;
  }
  .page-use .b0{
    position:relative;
    z-index:3;
    display:flex;
    justify-content:center;
    margin-top:clamp(38px,7vh,56px);
    opacity:0;
    animation:blockRise .6s cubic-bezier(.22,1,.36,1) 1s forwards;
  }
  .page-use .b0 .connect-btn{min-width:150px;padding:0 40px}

  html.dark{
    --paper:#0e0e0d;
    --ink:#f5f5f3;
    --line:#2b2b29;
    --panel:#171716;
    --btn-idle:#232321;
    --btn-active:#f5f5f3;
  }
  html.dark .aurora{opacity:.18}
  html.dark .mark svg{filter:invert(1)}
  html.dark .ground{background:radial-gradient(closest-side,rgba(245,245,243,.08),rgba(245,245,243,0) 72%)}
  html.dark .connect-btn{text-shadow:none;color:#f5f5f3}
  html.dark .connect-btn:hover,
  html.dark .connect-btn.is-loading,
  html.dark .connect-btn.is-done{color:#141412}
  html.dark .dd-trigger.has{color:#f5f5f3;text-shadow:none}
  html.dark .dd-trigger{color:rgba(245,245,243,.45)}
  html.dark .lb,
  html.dark .ld{background:#141412}
  html.dark .done svg{stroke:#141412}
  html.dark .bloomi{background:radial-gradient(circle,rgba(23,21,21,.5) 0%,rgba(23,21,21,0) 70%)}
  html.dark .di-meta{color:#8a8a86}
  html.dark .use-card:hover{border-color:#484845}
  html.dark .use-card[aria-checked="true"]{box-shadow:0 18px 36px -24px rgba(0,0,0,.7)}
  html.dark .sp-lm{filter:invert(1)}
  html.dark .use-card[aria-checked="true"] .uc-check svg{stroke:#141412}
  html.dark .agm-item:hover{border-color:#484845}
  html.dark .agm-item[aria-checked="true"] .uc-check svg{stroke:#141412}

  @media (max-width:560px){
    .page{padding-top:38px}
    .mark-slot{margin-top:clamp(44px,11vh,72px)}
    .connect-btn{height:50px;min-width:158px;font-size:18px}
    .dd-trigger{min-width:250px}
  }

  .exit-fold{
    position:fixed;
    inset:0;
    z-index:96;
    background:var(--ink);
    pointer-events:none;
    clip-path:circle(0px at var(--ex-x,50%) var(--ex-y,50%));
    transition:clip-path .62s cubic-bezier(.55,.06,.68,.19);
  }
  .exit-fold.go{
    clip-path:circle(var(--ex-r,150%) at var(--ex-x,50%) var(--ex-y,50%));
  }

  @media (prefers-reduced-motion: reduce){
    .title .ch{animation:none;opacity:1;filter:none;transform:none}
    .mark{animation:none;opacity:1;transform:none}
    .ground{animation:none;opacity:1}
    .aurora{animation:none}
    .beam-host::before,.beam-host::after,.halo{animation:none}
    .connect-btn,.connect-btn .face,.dd-trigger,.dd-menu,.dd-item,.theme-tgl{transition:none}
    .lb,.ld{animation-duration:2.4s}
    .page-repo:not(.settled) .title,
    .page-repo:not(.settled) .rise{opacity:0}
    .page-repo.settled .title,.page-repo.settled .rise{animation:none;opacity:1;filter:none;transform:none}
    .use-sub,.use-cards,.page-use .b0,.use-card{animation:none;opacity:1;transform:none}
    .uc-tag{transition:none}
  }
</style>

<button class="theme-tgl" id="theme" type="button" aria-pressed="false" aria-label="Toggle dark mode">
  <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<span class="sr" aria-live="polite" id="status"></span>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const stage = document.querySelector('.stage');
  const pg0 = document.getElementById('pg0');
  const pg1 = document.getElementById('pg1');
  const pg2 = document.getElementById('pg2');
  const titles = Array.from(document.querySelectorAll('.title'));
  const mark = document.getElementById('mark');
  const btn0 = document.getElementById('btn0');
  const btn1 = document.getElementById('btn1');
  const bloom1 = document.getElementById('bloom1');
  const btn2 = document.getElementById('btn2');
  const bloom2 = document.getElementById('bloom2');
  const btn3 = document.getElementById('btn3');
  const bloom3 = document.getElementById('bloom3');
  const pg3 = document.getElementById('pg3');
  const agList = document.getElementById('agmList');
  const btn4 = document.getElementById('btn4');
  const bloom4 = document.getElementById('bloom4');
  const pg4 = document.getElementById('pg4');
  const dd = document.getElementById('dd');
  const ddt = document.getElementById('ddt');
  const ddLabel = document.getElementById('ddLabel');
  const ddMenu = document.getElementById('ddMenu');
  const statusEl = document.getElementById('status');

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const INK_LIGHT = [23, 21, 21];
  const INK_DARK = [245, 245, 243];
  let INK = INK_LIGHT.slice();
  const ACC = ['#4b7cff', '#49a2ff', '#e85b83', '#f2c34c'].map(h => [
    parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)
  ]);

  const rootEl = document.documentElement;
  const tgl = document.getElementById('theme');

  function setInk() {
    INK = (rootEl.classList.contains('dark') ? INK_DARK : INK_LIGHT).slice();
  }

  try {
    if (localStorage.getItem('sparky-theme') === 'dark') {
      rootEl.classList.add('dark');
      tgl.setAttribute('aria-pressed', 'true');
      setInk();
    }
  } catch (e) {}

  titles.forEach(title => {
    const wordEls = Array.from(title.querySelectorAll('.w > span'));
    let k = 0;
    wordEls.forEach(w => {
      const txt = w.textContent;
      w.textContent = '';
      txt.split('').forEach(c => {
        const s = document.createElement('span');
        s.className = 'ch';
        s.textContent = c;
        s.style.setProperty('--k', k++);
        w.appendChild(s);
      });
    });
  });

  let chars = [];
  function bindChars() {
    const vis = document.querySelector('.page:not([hidden]) .title');
    chars = vis ? Array.from(vis.querySelectorAll('.ch')).map(el => ({ el, x: 0, y: 0, f: 0, v: 0 })) : [];
  }

  let cursor = null;
  let slotCX = 0, slotCY = 0;

  mark.addEventListener('click', e => e.preventDefault());

  const waves = [];
  const parts = [];
  let burstT0 = -1;

  const cv = document.getElementById('dots');
  const cx2 = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, base = null, grid = [];

  function buildGrid() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    grid = [];
    const gap = 26, m = 18;
    for (let y = m; y < H; y += gap)
      for (let x = m; x < W; x += gap)
        grid.push({ x, y, s: (x * 7 + y * 13) % 4 });
    base = document.createElement('canvas');
    base.width = W * dpr; base.height = H * dpr;
    const b = base.getContext('2d');
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    b.fillStyle = `rgba(${INK[0]},${INK[1]},${INK[2]},.055)`;
    for (const d of grid) {
      b.beginPath();
      b.arc(d.x, d.y, 1.15, 0, 7);
      b.fill();
    }
  }

  function measure() {
    const r = document.querySelector('.page:not([hidden]) .mark-slot');
    if (r) {
      const rr = r.getBoundingClientRect();
      slotCX = rr.left + rr.width / 2;
      slotCY = rr.top + rr.height / 2;
    }
    for (const c of chars) {
      const cr = c.el.getBoundingClientRect();
      c.x = cr.left + cr.width / 2;
      c.y = cr.top + cr.height / 2;
    }
  }

  stage.addEventListener('pointermove', e => { cursor = e; });
  stage.addEventListener('pointerleave', () => { cursor = null; });
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.connect-btn') || e.target.closest('#dd')) return;
    waves.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  });

  function spawnParts(x, y) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 2.6;
      parts.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.2,
        c: i % 4,
        life: 1
      });
    }
  }

  function centerOf(el) {
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }

  function bloomAt(btn, bloomEl, px, py) {
    const r = btn.getBoundingClientRect();
    bloomEl.style.setProperty('--bx', (px - r.left) + 'px');
    bloomEl.style.setProperty('--by', (py - r.top) + 'px');
    bloomEl.classList.remove('go');
    void bloomEl.offsetWidth;
    bloomEl.classList.add('go');
  }

  function runFlow(btn, bloomEl, doneText, hold, onHold, statusText) {
    if (btn.classList.contains('is-loading') || btn.classList.contains('is-done')) return;
    const isKb = flowX == null;
    const px = isKb ? centerOf(btn)[0] : flowX;
    const py = isKb ? centerOf(btn)[1] : flowY;
    flowX = null; flowY = null;
    bloomAt(btn, bloomEl, px, py);
    statusEl.textContent = statusText || (btn === btn1 ? 'Connecting to GitHub...' : 'Setting up your workspace...');
    btn.classList.add('is-loading');
    btn.querySelector('.done .txt').textContent = doneText;
    setTimeout(() => {
      btn.classList.remove('is-loading');
      btn.classList.add('is-done');
      statusEl.textContent = doneText === 'Connected' ? 'Connected to GitHub.' : 'Onboarding complete.';
      burstT0 = performance.now();
      spawnParts(px, py);
      waves.push({ x: px, y: py, t: performance.now() });
      waves.push({ x: slotCX, y: slotCY, t: performance.now() });
      if (hold > 0) setTimeout(onHold, hold);
    }, 1900);
  }

  let flowX = null, flowY = null;
  btn1.addEventListener('click', e => {
    flowX = e.clientX || null; flowY = e.clientY || null;
    if (flowX === 0 && flowY === 0) { flowX = null; flowY = null; }
    runFlow(btn1, bloom1, 'Connected', 5000, () => switchPage(purpose === 'agents' ? pg3 : pg4));
  });

  const useBtns = Array.from(document.querySelectorAll('.use-card'));
  const useCardsEl = document.getElementById('useCards');
  let purpose = 'testing';
  useBtns.forEach(c => {
    c.addEventListener('click', () => {
      purpose = c.dataset.id;
      useBtns.forEach(x => x.setAttribute('aria-checked', x === c ? 'true' : 'false'));
      const [px, py] = centerOf(c);
      waves.push({ x: px, y: py, t: performance.now() });
      statusEl.textContent = 'Selected ' + c.dataset.label + '.';
    });
  });
  useCardsEl.addEventListener('keydown', e => {
    let i = useBtns.findIndex(x => x.getAttribute('aria-checked') === 'true');
    if (i < 0) i = 0;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      e.preventDefault();
      i = (i + 1) % useBtns.length;
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      i = (i - 1 + useBtns.length) % useBtns.length;
    } else {
      return;
    }
    useBtns[i].click();
    useBtns[i].focus();
  });

  const AGENTS = [
    ['codex', 'Codex'],
    ['claude', 'Claude Code'],
    ['antigravity', 'Antigravity CLI'],
    ['sparky', 'Sparky']
  ];
  const agIcons = Array.from(document.querySelectorAll('#pg0 .lg'));
  const agmBtns = [];
  AGENTS.forEach((a, i) => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'agm-item';
    row.setAttribute('role', 'checkbox');
    row.setAttribute('aria-checked', 'true');
    row.dataset.id = a[0];
    row.style.setProperty('--j', i);
    const ic = agIcons[i];
    row.innerHTML =
      '<span class="uc-check"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg></span>' +
      '<span class="ag-ic">' + (ic ? ic.querySelector('svg, img').outerHTML : '') + '</span>' +
      '<span class="ag-nm">' + a[1] + '</span>';
    agList.appendChild(row);
    agmBtns.push(row);
    row.addEventListener('click', () => {
      const on = row.getAttribute('aria-checked') === 'true';
      row.setAttribute('aria-checked', on ? 'false' : 'true');
      const [px, py] = centerOf(row);
      waves.push({ x: px, y: py, t: performance.now() });
      const n = agmBtns.filter(x => x.getAttribute('aria-checked') === 'true').length;
      statusEl.textContent = n + (n === 1 ? ' agent selected.' : ' agents selected.');
    });
  });

  function switchToGithub() {
    statusEl.textContent = '';
    const [bx, by] = centerOf(btn0);
    const go = () => {
      pg0.hidden = true;
      pg1.hidden = false;
      bindChars();
      measure();
    };
    const done = () => {
      bindChars();
      measure();
      setTimeout(() => waves.push({ x: W / 2, y: H * .42, t: performance.now() }), 60);
    };
    const start = () => {
      if (document.startViewTransition && !reduce && !vtActive) {
        vtActive = true;
        rootEl.classList.remove('vt-in', 'vt-out', 'vt-page');
        rootEl.classList.add('vt-page');
        vtVars(bx, by);
        document.startViewTransition(go).finished.finally(() => {
          rootEl.classList.remove('vt-page');
          vtActive = false;
          done();
        });
      } else {
        go();
        done();
      }
    };
    start();
  }

  btn0.addEventListener('click', () => {
    try { localStorage.setItem('sparky-purpose', purpose); } catch (_) {}
    if (purpose === 'agents') switchToGithub();
    else straightCreate();
  });

  function straightCreate() {
    swapTo(pg4, pg0);
  }

  let vtActive = false;
  function vtVars(x, y) {
    rootEl.style.setProperty('--vt-x', x.toFixed(0) + 'px');
    rootEl.style.setProperty('--vt-y', y.toFixed(0) + 'px');
    rootEl.style.setProperty('--vt-r', Math.ceil(
      Math.max(
        Math.hypot(x, y), Math.hypot(W - x, y),
        Math.hypot(x, H - y), Math.hypot(W - x, H - y)
      ) + 8
    ) + 'px');
  }

  function swapTo(target, originEl) {
    statusEl.textContent = '';
    const [bx, by] = centerOf(originEl);
    const go = () => {
      originEl.hidden = true;
      target.hidden = false;
      target.classList.add('settled');
      bindChars();
      measure();
    };
    const start = () => {
      if (document.startViewTransition && !reduce && !vtActive) {
        vtActive = true;
        rootEl.classList.remove('vt-in', 'vt-out', 'vt-page');
        rootEl.classList.add('vt-page');
        vtVars(bx, by);
        document.startViewTransition(go).finished.finally(() => {
          rootEl.classList.remove('vt-page');
          vtActive = false;
          bindChars();
          measure();
          setTimeout(() => waves.push({ x: W / 2, y: H * .42, t: performance.now() }), 60);
        });
      } else {
        go();
        setTimeout(() => waves.push({ x: W / 2, y: H * .42, t: performance.now() }), 60);
      }
    };
    start();
  }

  function switchPage(next) {
    swapTo(next || pg2, pg1);
  }

  const REPOS = [
    ['sparky-ai-code/Sparky', 'main - updated 2d ago'],
    ['sparky-ai-code/sparky-website', 'main - updated 5d ago'],
    ['acme-co/platform', 'develop - updated 1h ago'],
    ['octocat/hello-world', 'main - updated 3w ago'],
    ['rust-core/agent-engine', 'trunk - updated 6h ago']
  ];
  const REPO_IC = '<svg class="di-ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>';
  REPOS.forEach((r, i) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'dd-item';
    item.setAttribute('role', 'option');
    item.setAttribute('aria-selected', 'false');
    item.style.setProperty('--j', i);
    item.innerHTML = `${REPO_IC}<span class="di-name">${r[0]}</span><span class="di-meta">${r[1]}</span>`;
    ddMenu.appendChild(item);
  });
  const items = Array.from(ddMenu.children);
  let chosen = null;

  function openMenu() {
    dd.classList.add('open');
    ddt.setAttribute('aria-expanded', 'true');
    setKb(-1);
  }
  function closeMenu() {
    dd.classList.remove('open');
    ddt.setAttribute('aria-expanded', 'false');
    setKb(-1);
  }
  let kb = -1;
  function setKb(i) {
    kb = i;
    items.forEach((it, j) => it.classList.toggle('kb-active', j === i));
  }

  ddt.addEventListener('click', () => {
    if (dd.classList.contains('open')) closeMenu();
    else openMenu();
  });
  document.addEventListener('pointerdown', e => {
    if (!dd.contains(e.target) && dd.classList.contains('open')) closeMenu();
  });
  dd.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeMenu(); ddt.focus(); return; }
    if (!dd.classList.contains('open')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setKb(Math.min(items.length - 1, kb + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setKb(Math.max(0, kb - 1)); }
    else if (e.key === 'Enter' && kb >= 0) { e.preventDefault(); items[kb].click(); }
  });
  items.forEach(it => {
    it.addEventListener('mouseenter', () => setKb(items.indexOf(it)));
    it.addEventListener('click', () => {
      chosen = it.querySelector('.di-name').textContent.trim();
      items.forEach(x => x.setAttribute('aria-selected', x === it ? 'true' : 'false'));
      ddLabel.textContent = chosen;
      dd.classList.add('has');
      closeMenu();
      const [dx, dy] = centerOf(ddt);
      waves.push({ x: dx, y: dy, t: performance.now() });
      statusEl.textContent = `Selected ${chosen}.`;
    });
  });

  btn2.addEventListener('click', e => {
    if (!chosen) {
      ddt.classList.remove('shake');
      void ddt.offsetWidth;
      ddt.classList.add('shake');
      const [dx, dy] = centerOf(ddt);
      waves.push({ x: dx, y: dy, t: performance.now() });
      openMenu();
      statusEl.textContent = 'Pick a repository first.';
      return;
    }
    flowX = e.clientX || null; flowY = e.clientY || null;
    if (flowX === 0 && flowY === 0) { flowX = null; flowY = null; }
    runFlow(btn2, bloom2, 'All set', 1500, launchApp);
  });

  btn3.addEventListener('click', e => {
    const picked = agmBtns.filter(x => x.getAttribute('aria-checked') === 'true').map(x => x.dataset.id);
    if (picked.length === 0) {
      agList.classList.remove('shake');
      void agList.offsetWidth;
      agList.classList.add('shake');
      const [gx, gy] = centerOf(agList);
      waves.push({ x: gx, y: gy, t: performance.now() });
      statusEl.textContent = 'Pick at least one agent.';
      return;
    }
    try { localStorage.setItem('sparky-agents', JSON.stringify(picked)); } catch (_) {}
    flowX = e.clientX || null; flowY = e.clientY || null;
    if (flowX === 0 && flowY === 0) { flowX = null; flowY = null; }
    runFlow(btn3, bloom3, 'All set', 1500, () => launchApp(btn3), 'Creating your machine...');
  });

  const pkgDd = document.getElementById('pkgDd');
  const pkgTrig = document.getElementById('pkgTrig');
  const pkgLabel = document.getElementById('pkgLabel');
  const pkgMenu = document.getElementById('pkgMenu');
  const PACKAGES = [
    ['1 vCPU · 512 MB', 'tiny', false],
    ['1 vCPU · 2 GiB', 'nano', false],
    ['2 vCPU · 4 GiB', 'Recommended', true],
    ['4 vCPU · 8 GiB', 'pro', false],
    ['8 vCPU · 16 GiB', 'wide', false]
  ];
  PACKAGES.forEach((p, i) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'dd-item';
    item.setAttribute('role', 'option');
    item.setAttribute('aria-selected', 'false');
    item.style.setProperty('--j', i);
    item.innerHTML = '<span class="di-name">' + p[0] + '</span><span class="di-meta' + (p[2] ? ' rec' : '') + '">' + p[1] + '</span>';
    pkgMenu.appendChild(item);
  });
  const pkgItems = Array.from(pkgMenu.children);
  let chosenPkg = null;
  function openPkg() {
    pkgDd.classList.add('open');
    pkgTrig.setAttribute('aria-expanded', 'true');
    setKbP(-1);
  }
  function closePkg() {
    pkgDd.classList.remove('open');
    pkgTrig.setAttribute('aria-expanded', 'false');
    setKbP(-1);
  }
  let kbP = -1;
  function setKbP(i) {
    kbP = i;
    pkgItems.forEach((it, j) => it.classList.toggle('kb-active', j === i));
  }
  pkgTrig.addEventListener('click', () => {
    if (pkgDd.classList.contains('open')) closePkg();
    else openPkg();
  });
  document.addEventListener('pointerdown', e => {
    if (!pkgDd.contains(e.target) && pkgDd.classList.contains('open')) closePkg();
  });
  pkgDd.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closePkg(); pkgTrig.focus(); return; }
    if (!pkgDd.classList.contains('open')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setKbP(Math.min(pkgItems.length - 1, kbP + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setKbP(Math.max(0, kbP - 1)); }
    else if (e.key === 'Enter' && kbP >= 0) { e.preventDefault(); pkgItems[kbP].click(); }
  });
  pkgItems.forEach(it => {
    it.addEventListener('mouseenter', () => setKbP(pkgItems.indexOf(it)));
    it.addEventListener('click', () => {
      chosenPkg = it.querySelector('.di-name').textContent.trim();
      pkgItems.forEach(x => x.setAttribute('aria-selected', x === it ? 'true' : 'false'));
      pkgLabel.textContent = chosenPkg;
      pkgDd.classList.add('has');
      closePkg();
      const [dx, dy] = centerOf(pkgTrig);
      waves.push({ x: dx, y: dy, t: performance.now() });
      statusEl.textContent = `Selected ${chosenPkg}.`;
    });
  });

  btn4.addEventListener('click', e => {
    if (!chosenPkg) {
      pkgTrig.classList.remove('shake');
      void pkgTrig.offsetWidth;
      pkgTrig.classList.add('shake');
      const [gx, gy] = centerOf(pkgTrig);
      waves.push({ x: gx, y: gy, t: performance.now() });
      statusEl.textContent = 'Pick a package first.';
      return;
    }
    flowX = e.clientX || null; flowY = e.clientY || null;
    if (flowX === 0 && flowY === 0) { flowX = null; flowY = null; }
    runFlow(btn4, bloom4, 'All set', 1500, () => launchApp(btn4), 'Creating your machine...');
  });

  function launchApp(fromBtn) {
    try { if (chosen) localStorage.setItem('sparky-last-repo', chosen); } catch (_) {}
    const b = fromBtn || btn2;
    const [ex, ey] = centerOf(b);
    const fold = document.createElement('div');
    fold.className = 'exit-fold';
    const fr = Math.ceil(Math.hypot(Math.max(ex, W - ex), Math.max(ey, H - ey)) + 14);
    fold.style.setProperty('--ex-x', ex.toFixed(0) + 'px');
    fold.style.setProperty('--ex-y', ey.toFixed(0) + 'px');
    fold.style.setProperty('--ex-r', fr + 'px');
    document.body.appendChild(fold);
    requestAnimationFrame(() => requestAnimationFrame(() => fold.classList.add('go')));
    setTimeout(() => { window.location.href = 'app.html'; }, 640);
  }

  function tick(now) {
    if (cursor) {
      for (const c of chars) {
        const dx = cursor.clientX - c.x, dy = cursor.clientY - c.y;
        const d = Math.hypot(dx, dy);
        const target = Math.max(0, 1 - d / 110);
        c.v += (target - c.f) * 0.16;
        c.v *= 0.7;
        c.f += c.v;
        const f = clamp(c.f, 0, 1.4);
        c.el.style.transform = f > 0.01 ? `translateY(${(-f * 4).toFixed(2)}px)` : 'none';
        c.el.style.filter = f > 0.02 ? `blur(${(f * 2.6).toFixed(2)}px)` : 'none';
      }
    }

    if (burstT0 > 0) {
      const bt = (now - burstT0) / 700;
      if (bt >= 1) burstT0 = -1;
    }

    cx2.clearRect(0, 0, W, H);
    cx2.drawImage(base, 0, 0, W, H);

    for (let i = waves.length - 1; i >= 0; i--) {
      if (now - waves[i].t > 900) waves.splice(i, 1);
    }

    for (const d of grid) {
      let f = 0, cxw = 0, cyw = 0, waveF = 0;
      if (cursor) {
        const dx = cursor.clientX - d.x, dy = cursor.clientY - d.y;
        const dd2 = Math.hypot(dx, dy);
        f = Math.max(0, 1 - dd2 / 150);
        f *= f;
        cxw = dx; cyw = dy;
      }
      for (const w of waves) {
        const age = (now - w.t) / 1000;
        const wr = age * 620;
        const dd3 = Math.hypot(w.x - d.x, w.y - d.y);
        const g = Math.exp(-Math.pow(dd3 - wr, 2) / 2600) * (1 - age / 0.9);
        if (g > waveF) waveF = g;
      }
      const tot = Math.max(f, waveF);
      if (tot < 0.015) continue;
      let px = d.x, py = d.y;
      if (cursor && f > 0) {
        const dd4 = Math.hypot(cxw, cyw) || 1;
        px += cxw / dd4 * f * 7;
        py += cyw / dd4 * f * 7;
      }
      const mixv = Math.min(1, tot * 0.85);
      const acc = ACC[d.s];
      const rC = lerp(INK[0], acc[0], mixv);
      const gC = lerp(INK[1], acc[1], mixv);
      const bC = lerp(INK[2], acc[2], mixv);
      cx2.fillStyle = `rgba(${rC | 0},${gC | 0},${bC | 0},${(0.055 + tot * 0.34).toFixed(3)})`;
      cx2.beginPath();
      cx2.arc(px, py, 1.15 + tot * 1.6, 0, 7);
      cx2.fill();
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.14;
      p.vx *= 0.985; p.vy *= 0.985;
      p.life -= 0.022;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      const a = ACC[p.c];
      cx2.fillStyle = `rgba(${a[0]},${a[1]},${a[2]},${p.life.toFixed(2)})`;
      cx2.beginPath();
      cx2.arc(p.x, p.y, 2.4 * p.life + 0.6, 0, 7);
      cx2.fill();
    }

    requestAnimationFrame(tick);
  }

  function init() {
    buildGrid();
    bindChars();
    measure();
    setTimeout(() => measure(), 1700);
    if (!reduce) requestAnimationFrame(tick);
  }

  tgl.addEventListener('click', () => {
    if (vtActive) return;
    const goingDark = !rootEl.classList.contains('dark');
    const r = tgl.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    vtVars(x, y);
    rootEl.classList.remove('vt-in', 'vt-out', 'vt-page');
    rootEl.classList.add(goingDark ? 'vt-in' : 'vt-out');
    tgl.setAttribute('aria-pressed', String(goingDark));
    try { localStorage.setItem('sparky-theme', goingDark ? 'dark' : 'light'); } catch (e) {}
    const apply = () => {
      rootEl.classList.toggle('dark', goingDark);
      setInk();
    };
    if (document.startViewTransition && !reduce) {
      vtActive = true;
      document.startViewTransition(apply).finished.finally(() => {
        rootEl.classList.remove('vt-in', 'vt-out');
        buildGrid();
        vtActive = false;
      });
    } else {
      apply();
      buildGrid();
    }
  });

  addEventListener('resize', () => { buildGrid(); measure(); });
  init();
</script>
</body>
</html>
