# CI-only software Xorg display. Do not ship until real guest tests pass.
Section "Device"
    Identifier "SoilDummy"
    Driver "dummy"
    VideoRam 32768
EndSection
Section "Monitor"
    Identifier "SoilMonitor"
    HorizSync 30-80
    VertRefresh 50-75
    Modeline "1360x768" 84.75 1360 1432 1568 1776 768 771 781 798 -hsync +vsync
EndSection
Section "Screen"
    Identifier "SoilScreen"
    Device "SoilDummy"
    Monitor "SoilMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1360x768"
        Virtual 1360 768
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "SoilLayout"
    Screen "SoilScreen"
EndSection
